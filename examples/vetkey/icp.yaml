# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v0.1.0/docs/schemas/icp-yaml-schema.json

canisters:
  - backend
  - frontend

networks:
  - name: local
    mode: managed
    gateway:
      bind: "0.0.0.0"
      port: 8000
    ii: true # iiが有効になる。 http://id.ai.localhost:8000/#authorize

environments:
  - name: local
    network: local
