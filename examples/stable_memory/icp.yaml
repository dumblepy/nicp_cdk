# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v0.1.0/docs/schemas/icp-yaml-schema.json

canisters:
  - backend

networks:
  - name: local
    mode: managed
    gateway:
      bind: "0.0.0.0"
      port: 8000
    ii: true # http://id.ai.localhost:8000/#authorize

environments:
  - name: local
    network: local
    canisters:
      - backend
    settings:
      backend:
        environment_variables:
          APP_ENV: "local"

  - name: staging
    network: ic
    canisters:
      - backend
    settings:
      backend:
        environment_variables:
          APP_ENV: "staging"

  - name: production
    network: ic
    canisters:
      - backend
    settings:
      backend:
        environment_variables:
          APP_ENV: "production"
